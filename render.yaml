databases:
  - name: umad-progress-db
    plan: free
    databaseName: umad_progress
    user: umad_user

services:
  # ------------------------------------------------------------------
  # Backend API Django (REST Framework + PostgreSQL + WhiteNoise)
  # ------------------------------------------------------------------
  - type: web
    name: umad-progress-api
    runtime: python
    plan: free
    buildCommand: "chmod +x backend/build.sh && ./backend/build.sh"
    startCommand: "cd backend && gunicorn backend.wsgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: umad-progress-db
          property: connectionString

  # ------------------------------------------------------------------
  # Frontend React (Vite SPA)
  # ------------------------------------------------------------------
  - type: web
    name: umad-progress-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL pública de la API (fromService/host solo da el nombre interno de la red privada)
      - key: VITE_API_URL
        value: https://umad-progress-api.onrender.com

